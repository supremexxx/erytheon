services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pyrorisk
      POSTGRES_USER: pyrorisk
      POSTGRES_PASSWORD: pyrorisk
    ports:
      - "5432:5432"
    volumes:
      - pyrorisk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyrorisk -d pyrorisk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pyrorisk-postgres:

