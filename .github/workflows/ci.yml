name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: pyrorisk
          POSTGRES_USER: pyrorisk
          POSTGRES_PASSWORD: pyrorisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyrorisk -d pyrorisk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pyrorisk:pyrorisk@localhost:5432/pyrorisk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

