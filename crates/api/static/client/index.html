<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4f6f4">
    <title>ERYTHEON — Risque incendie de ma commune</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23315342'/%3E%3Cpath d='M10 9h12v3H13v3h8v3h-8v3h9v3H10z' fill='%23f4f6f4'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://basemaps.cartocdn.com">
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    >
    <link rel="stylesheet" href="/client.css">
  </head>
  <body>
    <div class="cli-app">
      <header class="cli-topbar">
        <div class="cli-brand">
          <span class="cli-brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <circle cx="16" cy="16" r="11"></circle>
              <path d="M7.5 18.5c3.2-1 4.6-4.5 7.7-5.3 3-.8 5.4 1.6 9.2.6M10.3 24c1.9-2.5 2.6-5.9 5.7-7.2 2.6-1.1 4.7.1 6.7 1.6M12.2 8.2c1.1 2.2 3.1 3.4 5.7 3.1 2-.2 3.4-1.2 4.8-2.4"></path>
            </svg>
          </span>
          <div>
            <strong id="cli-commune-name">Risque incendie</strong>
            <small id="cli-commune-meta">Chargement…</small>
          </div>
        </div>

        <div class="cli-horizons" role="group" aria-label="Horizon de prévision">
          <button type="button" data-horizon="nowcast" aria-pressed="true">Maintenant</button>
          <button type="button" data-horizon="hours_6" aria-pressed="false">+6 h</button>
          <button type="button" data-horizon="hours_24" aria-pressed="false">+24 h</button>
          <button type="button" data-horizon="hours_48" aria-pressed="false">+48 h</button>
        </div>
      </header>

      <main class="cli-content">
        <div id="cli-map" class="cli-map" aria-label="Carte du risque incendie de la commune"></div>

        <div id="cli-loading" class="cli-loading"><span aria-hidden="true"></span>Chargement de la commune…</div>
        <div id="cli-error" class="cli-error" hidden></div>

        <aside class="cli-legend" aria-label="Légende du niveau de risque">
          <strong>Niveau de risque</strong>
          <div class="cli-legend-scale">
            <span class="cli-legend-swatch" style="background:#2f7a4f"></span>
            <span class="cli-legend-swatch" style="background:#d9b23c"></span>
            <span class="cli-legend-swatch" style="background:#d9622f"></span>
            <span class="cli-legend-swatch" style="background:#b3261e"></span>
          </div>
          <div class="cli-legend-labels">
            <span>Faible</span>
            <span>Élevé</span>
          </div>
        </aside>
      </main>

      <div id="cli-detail" class="cli-detail" hidden>
        <button type="button" id="cli-detail-close" class="cli-detail-close" aria-label="Fermer">&times;</button>
        <strong id="cli-detail-score">—</strong>
        <span id="cli-detail-time">—</span>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/client.js" defer></script>
  </body>
</html>
